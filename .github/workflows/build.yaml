name: Build Yi Pro / Kami 1080p firmware bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "3.*"

env:
  SUNXI_TOOLCHAIN: /opt/yi/toolchain-sunxi-musl

jobs:
  build:
    name: Build firmware bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git unzip build-essential \
            bison bisonc++ libbison-dev autoconf autotools-dev \
            automake libssl-dev zlib1g-dev libzzip-dev flex libfl-dev \
            yui-compressor closure-compiler optipng jpegoptim libtidy5deb1 node-less \
            sassc sass-spec libhtml-tidy-perl libxml2-utils rsync qemu-user-static p7zip-full

      - name: Test WiFi configuration parser
        run: sh scripts/test_configure_wifi.sh

      - name: Download toolchain
        run: |
          git clone --depth 1 https://github.com/lindenis-org/lindenis-v536-prebuilt
          sudo mkdir -p "${SUNXI_TOOLCHAIN}"
          sudo cp -r lindenis-v536-prebuilt/gcc/linux-x86/arm/toolchain-sunxi-musl/toolchain "${SUNXI_TOOLCHAIN}/"

      - name: Build shared firmware payload
        run: bash -ex scripts/compile.sh

      - name: Pack Yi Pro and Kami 1080p firmware
        run: |
          rm -rf out/y623 out/y28ga out/all
          sudo bash -ex scripts/pack_fw.all.sh

      - name: Verify bundle contents
        run: |
          set -e
          test "$(find out/all -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 2
          test "$(find out/all -maxdepth 1 -type f -name 'y623_*.tgz' | wc -l)" -eq 1
          test "$(find out/all -maxdepth 1 -type f -name 'y28ga_*.tgz' | wc -l)" -eq 1
          for model in y623 y28ga; do
            archive=$(find out/all -maxdepth 1 -type f -name "${model}_*.tgz")
            tar tzf "$archive" | grep -qx 'Factory/local_init.sh'
            tar tzf "$archive" | grep -qx 'yi-hack/script/configure_wifi.sh'
            tar tzf "$archive" | grep -qx 'yi-hack/startup.sh'
            tar xOzf "$archive" Factory/local_init.sh | sh -n
            tar xOzf "$archive" Factory/local_init.sh | grep -q 'script/configure_wifi.sh'
            tar xOzf "$archive" Factory/local_init.sh | grep -q '/tmp/sd/Factory/configure_wifi.cfg'
            tar xOzf "$archive" Factory/local_init.sh | grep -q '/tmp/sd/Factory/config.sh'
            tar xOzf "$archive" yi-hack/script/configure_wifi.sh | sh -n
            tar xOzf "$archive" yi-hack/startup.sh | sh -n
            tar xOzf "$archive" yi-hack/startup.sh | grep -q '/tmp/sd/Factory/config.sh'
            tar xOzf "$archive" Factory/config.sh | grep -q 'SD payload does not match bootstrap'
            tar xOzf "$archive" Factory/config.sh | grep -q 'init.\$CURRENT_INIT_MD5.sh'
            tar xOzf "$archive" Factory/config.sh | grep -q 'MIN_BACKUP_FREE_KIB=128'
            tar xOzf "$archive" Factory/config.sh | grep -q 'RECLAIM_PATHS='
            grep -q 'Factory.retired-web-' src/www/httpd/cgi-bin/fw_upgrade.sh
            ! tar xOzf "$archive" Factory/config.sh | grep -q 'EXPECTED_LEGACY_INIT_MD5='
            ! tar xOzf "$archive" yi-hack/script/wd.sh | grep -q 'ifconfig wlan0 down'
            ! tar xOzf "$archive" yi-hack/script/wifi_failover.sh | grep -q 'ifconfig wlan0 down'
            if tar xOzf "$archive" Factory/config.sh | grep -Eq '^[[:space:]]*cp /tmp/init\.sh /backup/init\.sh([[:space:]]|$)'; then
              echo "Legacy telnet init installer found in $archive" >&2
              exit 1
            fi
          done
          echo "Firmware bundle contents:"
          find out/all -maxdepth 1 -type f -name '*.tgz' -printf '  %f\n' | sort

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: yi-hack-Allwinner-v2X-firmware
          path: out/all/*.tgz
          if-no-files-found: error
          compression-level: 0
