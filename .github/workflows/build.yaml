name: Build Yi Pro / Kami 1080p flash-core firmware

on:
  workflow_dispatch: {}
  push:
    tags:
      - "3.*"

env:
  SUNXI_TOOLCHAIN: /opt/yi/toolchain-sunxi-musl

jobs:
  build:
    name: Build flash-core for both cameras
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git unzip build-essential cmake \
            bison bisonc++ libbison-dev autoconf autotools-dev \
            automake libssl-dev zlib1g-dev libzzip-dev flex libfl-dev \
            yui-compressor closure-compiler optipng jpegoptim libtidy5deb1 node-less \
            sassc sass-spec libhtml-tidy-perl libxml2-utils rsync qemu-user-static p7zip-full xz-utils ffmpeg busybox jq \
            squashfs-tools mtd-utils bubblewrap

      - name: Test WiFi configuration parser
        run: sh scripts/test_configure_wifi.sh

      - name: Verify two-model source and recovery scope
        run: python3 scripts/test_model_scope.py

      - name: Verify bundled LIVE555 source and camera patches
        run: python3 scripts/test_live555_source.py

      - name: Test y623 VE kernel release path
        run: sh scripts/test_y623_ve_kernel.sh

      - name: Test y623 motiond VE channel parser
        run: |
          gcc -Wall -Wextra -Werror -O2 src/motiond/tests/test_pressure.c src/ipc_cmd/ipc_cmd/motion_metadata_levels.c -lrt -o /tmp/test-motiond-pressure
          /tmp/test-motiond-pressure

      - name: Build and test kernel-owned service locks
        run: |
          bash scripts/build_test_busybox.sh /tmp/yi-host-busybox
          export YI_TEST_BUSYBOX=/tmp/yi-host-busybox/busybox-1.36.1/busybox
          echo "YI_TEST_BUSYBOX=$YI_TEST_BUSYBOX" >> "$GITHUB_ENV"
          python3 src/static/tests/test_service_serialization.py
          python3 src/static/tests/test_service_control.py
          python3 src/static/tests/test_operation_timeout.py
          python3 src/static/tests/test_ftppush_queue.py
          python3 src/static/tests/test_config_read_error.py
          python3 src/static/tests/test_hotspot.py
          python3 src/static/tests/test_wifi_station_guard.py
          python3 src/static/tests/test_wifi_recovery.py
          python3 src/static/tests/test_hotspot_api.py
          python3 src/static/tests/test_reset_hotspot.py
          python3 src/static/tests/test_flash_mount.py
          python3 src/static/tests/test_manual_time.py
          python3 scripts/test_flash_core.py
          python3 scripts/test_flash_core_build.py
          python3 scripts/test_flash_core_installer.py
          python3 scripts/test_firmware_maintenance.py
          node scripts/test_firmware_maintenance_ui.js

      - name: Test recorder-local motion metadata
        run: |
          python3 scripts/test_record_metadata.py
          python3 scripts/test_motion_history_service.py
          python3 scripts/test_record_preroll.py

      - name: Test configuration and local recording time
        run: |
          python3 scripts/test_rtsp_config.py
          python3 scripts/test_time_config.py
          python3 scripts/test_nightvision.py
          python3 scripts/test_motion_tuning.py
          python3 scripts/test_motion_robustness.py
          python3 scripts/test_motion_mask.py
          python3 scripts/test_motion_iva.py

      - name: Download toolchain
        run: |
          git clone --depth 1 https://github.com/lindenis-org/lindenis-v536-prebuilt
          sudo mkdir -p "${SUNXI_TOOLCHAIN}"
          sudo cp -r lindenis-v536-prebuilt/gcc/linux-x86/arm/toolchain-sunxi-musl/toolchain "${SUNXI_TOOLCHAIN}/"

      - name: Build shared firmware payload
        run: bash -ex scripts/compile.sh

      - name: Enable isolated ARM image checks
        run: |
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build and verify primary flash-core firmware and SD installers
        run: |
          python3 scripts/pack_flash_core_all.py \
            --payload build/yi-hack \
            --toolchain "${SUNXI_TOOLCHAIN}/toolchain/bin" \
            --host-busybox "$YI_TEST_BUSYBOX" \
            --qemu "$(command -v qemu-arm-static)" \
            --mkfs-jffs2 "$(command -v mkfs.jffs2)" \
            --output out/flash-core

      - name: Upload primary flash-core firmware
        uses: actions/upload-artifact@v4
        with:
          name: yi-hack-Allwinner-v2X-flash-core
          path: out/flash-core/packages/*
          if-no-files-found: error
          compression-level: 0
